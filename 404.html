<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yönlendiriliyor...</title>
  <script>
    var l = window.location;
    var base = '/emreturksoy-web';
    var path = l.pathname.replace(base, '') || '/';
    if (path.indexOf('/admin') === 0) {
      l.replace(l.protocol + '//' + l.host + base + '/admin/');
    } else {
      l.replace(l.protocol + '//' + l.host + base + '/#' + path);
    }
  </script>
</head>
<body></body>
</html>
