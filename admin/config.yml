backend:
  name: github
  repo: emretrksy/emreturksoy-web
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:

  # ── BLOG YAZILARI ──────────────────────────────────
  - name: "posts"
    label: "Blog Yazıları"
    label_singular: "Yazı"
    folder: "content/posts"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: slug
    fields:
      - { label: "Slug (URL — boşluk ve Türkçe karakter kullanma)", name: "slug", widget: "string" }
      - { label: "Kategori", name: "category", widget: "select",
          options: [
            {label: "Devlog", value: "devlog"},
            {label: "Eğitim / Tutorial", value: "tutorial"},
            {label: "Post-Mortem", value: "postmortem"},
            {label: "Deneme / Essay", value: "essay"}
          ], default: "devlog" }
      - { label: "Tarih", name: "date", widget: "datetime",
          date_format: "YYYY-MM-DD", time_format: false, default: "" }
      - label: "Başlık"
        name: "title"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "string" }
          - { label: "İngilizce", name: "en", widget: "string" }
      - label: "Özet (Blog kartında görünür)"
        name: "excerpt"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "text" }
          - { label: "İngilizce", name: "en", widget: "text" }
      - label: "İçerik (Türkçe)"
        name: "body_tr"
        widget: "markdown"
      - label: "İçerik (İngilizce)"
        name: "body_en"
        widget: "markdown"
      - { label: "Yayında mı?", name: "published", widget: "boolean", default: true }

  # ── PROJELER ───────────────────────────────────────
  - name: "projects"
    label: "Projeler"
    label_singular: "Proje"
    folder: "content/projects"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: slug
    fields:
      - { label: "Slug (değiştirme!)", name: "slug", widget: "string",
          hint: "evo, myco, karadeniz-jam, lamquarium, tank-2025 — sitedekiyle eşleşmeli" }
      - { label: "Sıra (küçük = önce)", name: "order", widget: "number", default: 99 }
      - label: "Başlık"
        name: "title"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "string" }
          - { label: "İngilizce", name: "en", widget: "string" }
      - label: "Kısa Açıklama (hover veya meta)"
        name: "description"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "string" }
          - { label: "İngilizce", name: "en", widget: "string" }
      - { label: "Hover / Önizleme Görseli", name: "image", widget: "image", required: false }
      - { label: "Link (itch.io / GitHub / demo)", name: "url", widget: "string",
          default: "#", required: false }
      - { label: "Teknolojiler (virgülle ayır → otomatik listeye dönüşür)",
          name: "tech", widget: "string",
          hint: "Örnek: Godot 4, GDScript, Aseprite" }
      - { label: "Yayında mı?", name: "published", widget: "boolean", default: true }

  # ── DİYALOG AĞACI ──────────────────────────────────
  - name: "dialogue"
    label: "Ana Karakter — Diyalog Ağacı"
    files:
      - label: "Diyalog Nodeları"
        name: "dialogue_tree"
        file: "content/dialogue.json"
        fields:
          - label: "Nodelar"
            name: "nodes"
            widget: "list"
            summary: "{{fields.key}}"
            fields:
              - { label: "Node Anahtarı", name: "key", widget: "string",
                  hint: "Örnek: root, inventory, quest — boşluk kullanma" }
              - label: "Konuşmacı"
                name: "speaker"
                widget: "object"
                fields:
                  - { label: "Türkçe", name: "tr", widget: "string" }
                  - { label: "İngilizce", name: "en", widget: "string" }
              - label: "Diyalog Metni ([kelime] ile teal, \\n ile satır sonu)"
                name: "text"
                widget: "object"
                fields:
                  - { label: "Türkçe", name: "tr", widget: "text" }
                  - { label: "İngilizce", name: "en", widget: "text" }
              - label: "Seçenekler"
                name: "choices"
                widget: "list"
                summary: "{{fields.next}}"
                fields:
                  - label: "Etiket"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "Türkçe", name: "tr", widget: "string" }
                      - { label: "İngilizce", name: "en", widget: "string" }
                  - { label: "Gidilecek node (key)", name: "next", widget: "string" }
