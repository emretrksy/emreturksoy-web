backend:
  name: github
  repo: GITHUB_USERNAME/REPO_NAME   # ← buraya kendi kullanıcı adın/repo adın
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:

  # ── BLOG YAZILARI ──────────────────────────────────────
  - name: "posts"
    label: "Blog Yazıları"
    label_singular: "Yazı"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: "Slug (URL)", name: "slug", widget: "string", hint: "URL'de görünecek kısım, Türkçe karakter ve boşluk kullanma. Örnek: evo-devlog-2" }
      - { label: "Kategori", name: "category", widget: "select", options: ["devlog","tutorial","postmortem","essay"], default: "devlog" }
      - { label: "Tarih", name: "date", widget: "datetime", date_format: "MMMM YYYY", time_format: false }
      - label: "Başlık"
        name: "title"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "string" }
          - { label: "İngilizce", name: "en", widget: "string" }
      - label: "Özet (Kart Açıklaması)"
        name: "excerpt"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "text" }
          - { label: "İngilizce", name: "en", widget: "text" }
      - label: "İçerik"
        name: "body"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "markdown" }
          - { label: "İngilizce", name: "en", widget: "markdown" }
      - { label: "Yayında mı?", name: "published", widget: "boolean", default: true }

  # ── PROJELER ───────────────────────────────────────────
  - name: "projects"
    label: "Projeler"
    label_singular: "Proje"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Sıra", name: "order", widget: "number", default: 1, hint: "Küçük sayı önce gösterilir" }
      - label: "Proje Adı"
        name: "title"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "string" }
          - { label: "İngilizce", name: "en", widget: "string" }
      - label: "Açıklama"
        name: "description"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "text" }
          - { label: "İngilizce", name: "en", widget: "text" }
      - { label: "Hover Görseli", name: "image", widget: "image", required: false }
      - { label: "Link (itch.io / GitHub / demo)", name: "url", widget: "string", required: false }
      - { label: "İkinci Link Etiketi", name: "url2_label", widget: "string", required: false, hint: "Örnek: GitHub" }
      - { label: "İkinci Link URL", name: "url2", widget: "string", required: false }
      - { label: "Teknolojiler", name: "tech", widget: "list", default: ["Godot 4", "C#"] }
      - { label: "Yayında mı?", name: "published", widget: "boolean", default: true }

  # ── DİYALOG AĞACI ──────────────────────────────────────
  - name: "dialogue"
    label: "Ana Karakter — Diyalog Ağacı"
    files:
      - label: "Diyalog Düzenleyici"
        name: "dialogue_tree"
        file: "content/dialogue.json"
        fields:
          - label: "Diyalog Nodeları"
            name: "nodes"
            widget: "list"
            summary: "{{fields.key}} — {{fields.speaker_en}}"
            fields:
              - { label: "Node Anahtarı (key)", name: "key", widget: "string", hint: "Örnek: root, inventory, quest. Boşluk kullanma." }
              - label: "Konuşmacı"
                name: "speaker"
                widget: "object"
                fields:
                  - { label: "Türkçe", name: "tr", widget: "string" }
                  - { label: "İngilizce", name: "en", widget: "string" }
              - label: "Diyalog Metni"
                name: "text"
                widget: "object"
                fields:
                  - { label: "Türkçe", name: "tr", widget: "text", hint: "[kelime] ile teal renk, \\n ile satır sonu" }
                  - { label: "İngilizce", name: "en", widget: "text", hint: "[word] for teal color, \\n for newline" }
              - label: "Seçenekler"
                name: "choices"
                widget: "list"
                summary: "{{fields.label_en}} → {{fields.next}}"
                fields:
                  - label: "Seçenek Etiketi"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "Türkçe", name: "tr", widget: "string" }
                      - { label: "İngilizce", name: "en", widget: "string" }
                  - { label: "Gidilecek Node (next key)", name: "next", widget: "string" }
