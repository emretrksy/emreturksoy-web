backend:
  name: github
  repo: emretrksy/emreturksoy-web
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:

  - name: "posts"
    label: "Blog Yazıları"
    label_singular: "Yazı"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: slug
    fields:
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - { label: "Kategori", name: "category", widget: "select", options: ["devlog","tutorial","postmortem","essay"], default: "devlog" }
      - { label: "Tarih", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Başlık"
        name: "title"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "string" }
          - { label: "İngilizce", name: "en", widget: "string" }
      - label: "Özet"
        name: "excerpt"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "text" }
          - { label: "İngilizce", name: "en", widget: "text" }
      - label: "İçerik"
        name: "body"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "markdown" }
          - { label: "İngilizce", name: "en", widget: "markdown" }
      - { label: "Yayında mı?", name: "published", widget: "boolean", default: true }

  - name: "projects"
    label: "Projeler"
    label_singular: "Proje"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Sıra", name: "order", widget: "number", default: 1 }
      - label: "Proje Adı"
        name: "title"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "string" }
          - { label: "İngilizce", name: "en", widget: "string" }
      - label: "Açıklama"
        name: "description"
        widget: "object"
        fields:
          - { label: "Türkçe", name: "tr", widget: "text" }
          - { label: "İngilizce", name: "en", widget: "text" }
      - { label: "Hover Görseli", name: "image", widget: "image", required: false }
      - { label: "Link", name: "url", widget: "string", required: false }
      - { label: "Teknolojiler", name: "tech", widget: "list" }
      - { label: "Yayında mı?", name: "published", widget: "boolean", default: true }

  - name: "dialogue"
    label: "Ana Karakter — Diyalog Ağacı"
    files:
      - label: "Diyalog Düzenleyici"
        name: "dialogue_tree"
        file: "content/dialogue.json"
        fields:
          - label: "Diyalog Nodeları"
            name: "nodes"
            widget: "list"
            summary: "{{fields.key}}"
            fields:
              - { label: "Node Anahtarı (key)", name: "key", widget: "string" }
              - label: "Konuşmacı"
                name: "speaker"
                widget: "object"
                fields:
                  - { label: "Türkçe", name: "tr", widget: "string" }
                  - { label: "İngilizce", name: "en", widget: "string" }
              - label: "Diyalog Metni"
                name: "text"
                widget: "object"
                fields:
                  - { label: "Türkçe", name: "tr", widget: "text" }
                  - { label: "İngilizce", name: "en", widget: "text" }
              - label: "Seçenekler"
                name: "choices"
                widget: "list"
                summary: "{{fields.next}}"
                fields:
                  - label: "Seçenek Etiketi"
                    name: "label"
                    widget: "object"
                    fields:
                      - { label: "Türkçe", name: "tr", widget: "string" }
                      - { label: "İngilizce", name: "en", widget: "string" }
                  - { label: "Gidilecek Node", name: "next", widget: "string" }
